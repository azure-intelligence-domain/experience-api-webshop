openapi: 3.0.3
info:
  title: '[Channel] Webshop Experience API'
  version: 1.0.0
  description: 'The webshop channel, for the customer portal: browse products, place an order for a customer, follow
    it end to end (SAP invoices, the 3PL shipment, every fact on its timeline), cancel it, change where it goes,
    and pay its invoice. Shapes what the Process and System APIs say for the webshop; the order domain decides (ADR
    0017).'
  contact:
    name: Channel Team
    url: https://github.com/azure-intelligence-domain/experience-api-webshop
  license:
    name: MIT
    url: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/LICENSE
  x-gateway: other
x-gateway: other
externalDocs:
  description: EventCatalog entry of the channel domain
  url: https://azure-intelligence-domain.github.io/eventcatalog/docs/domains/channel/1.0.0
servers:
- url: https://apim-intplat-demo.azure-api.net/webshop
  description: Main gateway, for staff signed in with Google through the customer portal. No version in the URI.
security:
- staffToken: []
- platformToken: []
tags:
- name: Webshop
  description: Shopping and following orders.
paths:
  /products:
    x-summary: Retrieve List of Products
    get:
      tags:
      - Webshop
      operationId: retrieveListOfProducts
      summary: Retrieve List of Products
      description: 'The catalogue: what can be ordered, at which price.'
      parameters:
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The products.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/productList'
              example:
                _links:
                  self:
                    href: /products
                totalCount: 1
                _embedded:
                  products:
                  - _links:
                      self:
                        href: /products/SKU-1042
                    productId: SKU-1042
                    name: Hydraulic Press HP-1042
                    description: 40-tonne hydraulic workshop press.
                    family: Machinery
                    unitPrice:
                      value: 7000.0
                      currency: EUR
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /products
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /products
        '502':
          description: A Process or System API behind the gateway failed; try again later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/downstream-failure.md
                title: Downstream Failure
                status: 502
                detail: A Process or System API behind the gateway failed; try again later.
                instance: /products
      x-business-keys: {}
  /customers:
    x-summary: Retrieve List of Customers
    get:
      tags:
      - Webshop
      operationId: retrieveListOfCustomers
      summary: Retrieve List of Customers
      description: The customers staff may shop for.
      parameters:
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The customers.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/customerList'
              example:
                _links:
                  self:
                    href: /customers
                totalCount: 1
                _embedded:
                  customers:
                  - _links:
                      self:
                        href: /customers/ACME
                      orders:
                        href: /orders?customerId=ACME
                    customerId: ACME
                    name: ACME Corporation
                    industry: Manufacturing
                    shippingAddress:
                      street: Rue de la Loi 16
                      postalCode: '1000'
                      city: Brussels
                      countryCode: BE
                    currency: EUR
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /customers
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /customers
        '502':
          description: A Process or System API behind the gateway failed; try again later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/downstream-failure.md
                title: Downstream Failure
                status: 502
                detail: A Process or System API behind the gateway failed; try again later.
                instance: /customers
      x-business-keys: {}
  /orders:
    x-summary: Orders
    get:
      tags:
      - Webshop
      operationId: retrieveListOfOrders
      summary: Retrieve List of Orders
      description: Orders, newest first, optionally of one customer or with one status.
      parameters:
      - $ref: '#/components/parameters/customerIdQuery'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: A page of orders.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/orderList'
              example:
                _links:
                  self:
                    href: /orders?customerId=ACME&offset=0&limit=20
                  first:
                    href: /orders?customerId=ACME&offset=0&limit=20
                  last:
                    href: /orders?customerId=ACME&offset=0&limit=20
                totalCount: 1
                _embedded:
                  orders:
                  - _links:
                      self:
                        href: /orders/4711
                    orderId: '4711'
                    customerId: ACME
                    channel: webshop
                    status: shipped
                    paymentStatus: invoiced
                    totalAmount:
                      value: 84000.0
                      currency: EUR
                    createdAt: '2026-10-03T09:12:00Z'
                    updatedAt: '2026-10-04T07:30:02Z'
                    lineCount: 1
                    trackingNumber: SPD4711BE
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
