components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Google ID token for the customer portal's OAuth client, of a Google Workspace account of the
        staff domain (routing/staff.yaml in integration-platform; ADR 0017).
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Entra ID token for the intplat-platform-apis application, of a building block on the platform's
        allow-list (the journey test).
  parameters:
    correlationId:
      name: Correlation-Id
      in: header
      required: true
      description: The business journey this call belongs to, for example ord-4711 or web-7f3a.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
      example: ord-4711
    orderId:
      name: orderId
      in: path
      required: true
      description: The order id, for example 4711.
      schema:
        type: string
        pattern: ^[0-9]+$
      example: '4711'
    customerIdQuery:
      name: customerId
      in: query
      required: false
      description: Only orders of this customer.
      schema:
        type: string
      example: ACME
    status:
      name: status
      in: query
      required: false
      description: Only orders with this status.
      schema:
        type: string
      example: shipped
    offset:
      name: offset
      in: query
      required: false
      description: Orders to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    limit:
      name: limit
      in: query
      required: false
      description: Orders per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    reason:
      name: reason
      in: query
      required: false
      description: Why, at most 200 characters.
      schema:
        type: string
        maxLength: 200
      example: Ordered twice by mistake.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A retry with the same key places nothing new.
      schema:
        type: string
        maxLength: 64
      example: 0b7e2a4c-4711-4c1e-9d2a-acme0001
  schemas:
    money:
      type: object
      description: An amount of money.
      required:
      - value
      - currency
      properties:
        value:
          type: number
          description: The amount.
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: ^[A-Z]{3}$
    deliveryAddress:
      type: object
      description: Delivery address.
      required:
      - street
      - postalCode
      - city
      - countryCode
      properties:
        street:
          type: string
          description: Street and number.
          minLength: 1
        postalCode:
          type: string
          description: Postal code.
          minLength: 1
        city:
          type: string
          description: City.
          minLength: 1
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
    halLink:
      type: object
      description: A HAL link.
      required:
      - href
      properties:
        href:
          type: string
          description: URI relative to the API root.
    problemDetail:
      type: object
      description: Problem Details (RFC 9457).
      required:
      - title
      - detail
      properties:
        type:
          type: string
          description: Problem type.
          format: uri
        title:
          type: string
          description: Summary.
        status:
          type: integer
          description: HTTP status.
        detail:
          type: string
          description: This occurrence.
        instance:
          type: string
          description: Request URI.
    customer:
      type: object
      description: A customer.
      required:
      - _links
      - customerId
      - name
      - shippingAddress
      - currency
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
            orders:
              $ref: '#/components/schemas/halLink'
        customerId:
          type: string
          description: The customer, e.g. ACME.
        name:
          type: string
          description: Name.
        industry:
          type: string
          description: Industry.
        shippingAddress:
          $ref: '#/components/schemas/deliveryAddress'
        currency:
          type: string
          description: The customer's currency.
          pattern: ^[A-Z]{3}$
    customerList:
      type: object
      description: All customers.
      required:
      - _links
      - totalCount
      - _embedded
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        totalCount:
          type: integer
          description: Number of customers.
          minimum: 0
        _embedded:
          type: object
          description: The customers.
          required:
          - customers
          properties:
            customers:
              type: array
              description: Customers.
              items:
                $ref: '#/components/schemas/customer'
    invoice:
      type: object
      description: An invoice of the order.
      required:
      - invoiceNumber
      - amount
      - paidAmount
      - status
      - issuedAt
      - dueDate
      properties:
        invoiceNumber:
          type: string
          description: Invoice number.
        amount:
          $ref: '#/components/schemas/money'
        paidAmount:
          $ref: '#/components/schemas/money'
        status:
          type: string
          description: Open until paid in full. More values may follow.
          x-extensible-enum:
          - open
          - paid
        issuedAt:
          type: string
          description: Issued. ISO 8601, UTC.
          format: date-time
        dueDate:
          type: string
          description: Due date. ISO 8601.
          format: date
        creditNote:
          type: object
          description: Present when a credit note reversed the invoice (the order was cancelled).
          required:
          - creditNoteNumber
          - amount
          - issuedAt
          properties:
            creditNoteNumber:
              type: string
              description: Credit note number.
            amount:
              $ref: '#/components/schemas/money'
            issuedAt:
              type: string
              description: Issued. ISO 8601, UTC.
              format: date-time
    orderSummary:
      type: object
      description: An order in a list.
      required:
      - _links
      - orderId
      - customerId
      - status
      - paymentStatus
      - totalAmount
      - createdAt
      - lineCount
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        orderId:
          type: string
          description: The order id.
        customerId:
          type: string
          description: The customer.
        channel:
          type: string
          description: Where it was placed.
        status:
          type: string
          description: The order domain's status. More values may follow.
          x-extensible-enum:
          - placed
          - confirmed
          - rejected
          - onHold
          - readyForShipment
          - shipped
          - delivered
          - completed
          - cancelled
        paymentStatus:
          type: string
          description: Payment status. More values may follow.
          x-extensible-enum:
          - unpaid
          - invoiced
          - paid
        totalAmount:
          $ref: '#/components/schemas/money'
        createdAt:
          type: string
          description: Placed. ISO 8601, UTC.
          format: date-time
        updatedAt:
          type: string
          description: Last changed. ISO 8601, UTC.
          format: date-time
        lineCount:
          type: integer
          description: Number of lines.
          minimum: 1
        trackingNumber:
          type: string
          description: The 3PL's tracking number, once booked.
    orderList:
      type: object
      description: A page of orders (adidas pagination).
      required:
      - _links
      - totalCount
      - _embedded
      properties:
        _links:
          type: object
          description: self, first, last, prev, next.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
            first:
              $ref: '#/components/schemas/halLink'
            last:
              $ref: '#/components/schemas/halLink'
            prev:
              $ref: '#/components/schemas/halLink'
            next:
              $ref: '#/components/schemas/halLink'
        totalCount:
          type: integer
          description: Matching orders.
          minimum: 0
        _embedded:
          type: object
          description: The orders on this page.
          required:
          - orders
          properties:
            orders:
              type: array
              description: Orders.
              items:
                $ref: '#/components/schemas/orderSummary'
    orderView:
      type: object
      description: One order with everything about it.
      required:
      - _links
      - orderId
      - customerId
      - status
      - paymentStatus
      - totalAmount
      - deliveryAddress
      - orderLines
      - progress
      - timeline
      - invoices
      - createdAt
      properties:
        _links:
          type: object
          description: 'HAL links: self, and one link per action the order domain allows now.'
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
            cancel:
              $ref: '#/components/schemas/halLink'
            changeDeliveryAddress:
              $ref: '#/components/schemas/halLink'
            pay:
              $ref: '#/components/schemas/halLink'
        orderId:
          type: string
          description: The order id.
        customerId:
          type: string
          description: The customer.
        channel:
          type: string
          description: Where the order was placed.
        status:
          type: string
          description: The order domain's status. More values may follow.
          x-extensible-enum:
          - placed
          - confirmed
          - rejected
          - onHold
          - readyForShipment
          - shipped
          - delivered
          - completed
          - cancelled
        paymentStatus:
          type: string
          description: Payment status. More values may follow.
          x-extensible-enum:
          - unpaid
          - invoiced
          - paid
        totalAmount:
          $ref: '#/components/schemas/money'
        deliveryAddress:
          $ref: '#/components/schemas/deliveryAddress'
        requestedDeliveryDate:
          type: string
          description: Requested delivery date. ISO 8601.
          format: date
        holdReason:
          type: string
          description: Why the order is on hold, when it is.
        cancellationReason:
          type: string
          description: Why the order was cancelled, when it was.
        createdAt:
          type: string
          description: Placed. ISO 8601, UTC.
          format: date-time
        updatedAt:
          type: string
          description: Last changed. ISO 8601, UTC.
          format: date-time
        orderLines:
          type: array
          description: The lines, with their product names and amounts.
          items:
            type: object
            description: A line.
            required:
            - lineNumber
            - productId
            - quantity
            - unitPrice
            - lineAmount
            properties:
              lineNumber:
                type: integer
                description: Line number.
                minimum: 1
              productId:
                type: string
                description: The product.
              productName:
                type: string
                description: The product's name.
              quantity:
                type: integer
                description: Units.
                minimum: 1
              unitPrice:
                $ref: '#/components/schemas/money'
              lineAmount:
                $ref: '#/components/schemas/money'
        progress:
          type: array
          description: 'The order''s way, milestone by milestone: placed, confirmed, readyForShipment, shipped,
            delivered, completed.'
          items:
            type: object
            description: A milestone.
            required:
            - milestone
            - reached
            properties:
              milestone:
                type: string
                description: The milestone.
              reached:
                type: boolean
                description: Reached yet.
              reachedAt:
                type: string
                description: When. ISO 8601, UTC.
                format: date-time
        timeline:
          type: array
          description: Every business fact about the order, from every domain, oldest first, in plain words.
          items:
            type: object
            description: A fact.
            required:
            - fact
            - domain
            - occurredAt
            - description
            properties:
              fact:
                type: string
                description: The business fact, e.g. SalesOrderAccepted.
              domain:
                type: string
                description: Who published it, e.g. finance.
              occurredAt:
                type: string
                description: When. ISO 8601, UTC.
                format: date-time
              description:
                type: string
                description: What it means, in plain words.
        invoices:
          type: array
          description: The order's invoices (finance).
          items:
            $ref: '#/components/schemas/invoice'
        shipment:
          type: object
          description: The order's shipment with the 3PL partner (logistics), once booked.
          required:
          - shipmentId
          - partnerId
          - trackingNumber
          - status
          properties:
            shipmentId:
              type: string
              description: Consignment id.
            partnerId:
              type: string
              description: The 3PL partner.
            trackingNumber:
              type: string
              description: Tracking number.
            status:
              type: string
              description: Where the shipment is. More values may follow.
              x-extensible-enum:
              - booked
              - dispatched
              - delivered
              - cancelled
            bookedAt:
              type: string
              description: Booked. ISO 8601, UTC.
              format: date-time
            dispatchedAt:
              type: string
              description: Picked up by the partner. ISO 8601, UTC.
              format: date-time
            deliveredAt:
              type: string
              description: Delivered. ISO 8601, UTC.
              format: date-time
            receivedBy:
              type: string
              description: Who signed for it.
            cancelledAt:
              type: string
              description: Cancelled. ISO 8601, UTC.
              format: date-time
    product:
      type: object
      description: A product in the catalogue, with its price.
      required:
      - _links
      - productId
      - name
      - unitPrice
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        productId:
          type: string
          description: The product, e.g. SKU-1042.
        name:
          type: string
          description: Name.
        description:
          type: string
          description: Description.
        family:
          type: string
          description: Family.
        unitPrice:
          $ref: '#/components/schemas/money'
    productList:
      type: object
      description: The catalogue.
      required:
      - _links
      - totalCount
      - _embedded
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        totalCount:
          type: integer
          description: Number of products.
          minimum: 0
        _embedded:
          type: object
          description: The products.
          required:
          - products
          properties:
            products:
              type: array
              description: Products.
              items:
                $ref: '#/components/schemas/product'
    placeOrderRequest:
      type: object
      description: 'An order from the webshop: the webshop prices the lines from the catalogue.'
      required:
      - customerId
      - orderLines
      properties:
        customerId:
          type: string
          description: The customer, e.g. ACME.
          minLength: 1
        orderLines:
          type: array
          description: What to order.
          items:
            type: object
            description: A line.
            required:
            - productId
            - quantity
            properties:
              productId:
                type: string
                description: The product.
              quantity:
                type: integer
                description: Units.
                minimum: 1
                maximum: 1000
          minItems: 1
        deliveryAddress:
          allOf:
          - $ref: '#/components/schemas/deliveryAddress'
          description: Where to deliver; the customer's shipping address if omitted.
        requestedDeliveryDate:
          type: string
          description: Requested delivery date. ISO 8601.
          format: date
      additionalProperties: false
    paymentRequest:
      type: object
      description: Pay an invoice of the order in full.
      required:
      - invoiceNumber
      properties:
        invoiceNumber:
          type: string
          description: The invoice.
          minLength: 1
    payment:
      type: object
      description: A payment.
      required:
      - _links
      - paymentId
      - invoiceNumber
      - amount
      - invoicePaidInFull
      - receivedAt
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
            order:
              $ref: '#/components/schemas/halLink'
        paymentId:
          type: string
          description: Payment document.
        invoiceNumber:
          type: string
          description: The invoice.
        amount:
          $ref: '#/components/schemas/money'
        invoicePaidInFull:
          type: boolean
          description: true once the invoice is covered.
        receivedAt:
          type: string
          description: When. ISO 8601, UTC.
          format: date-time
