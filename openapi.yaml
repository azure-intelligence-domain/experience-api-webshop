          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/downstream-failure.md
                title: Downstream Failure
                status: 502
                detail: A Process or System API behind the gateway failed; try again later.
                instance: /orders?customerId=ACME
      x-business-keys:
        customerid: query.customerId
    post:
      tags:
      - Webshop
      operationId: placeOrder
      summary: Place Order
      description: 'Places an order for a customer: the lines are priced from the catalogue, delivered to the customer''s
        shipping address unless another is given. The order domain publishes OrderPlaced; SAP, the warehouse and
        the 3PL follow by events.'
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: The order, placed.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/orderView'
              example:
                _links:
                  self:
                    href: /orders/4711
                  cancel:
                    href: /orders/4711
                  changeDeliveryAddress:
                    href: /orders/4711/delivery-address
                orderId: '4711'
                customerId: ACME
                channel: webshop
                status: placed
                paymentStatus: unpaid
                totalAmount:
                  value: 84000.0
                  currency: EUR
                deliveryAddress:
                  street: Rue de la Loi 16
                  postalCode: '1000'
                  city: Brussels
                  countryCode: BE
                requestedDeliveryDate: '2026-10-09'
                createdAt: '2026-10-03T09:12:00Z'
                updatedAt: '2026-10-04T07:30:02Z'
                orderLines:
                - lineNumber: 1
                  productId: SKU-1042
                  productName: Hydraulic Press HP-1042
                  quantity: 12
                  unitPrice:
                    value: 7000.0
                    currency: EUR
                  lineAmount:
                    value: 84000.0
                    currency: EUR
                progress:
                - milestone: placed
                  reached: true
                  reachedAt: '2026-10-03T09:12:00Z'
                - milestone: confirmed
                  reached: false
                  reachedAt: '2026-10-03T09:12:06Z'
                - milestone: readyForShipment
                  reached: false
                  reachedAt: '2026-10-03T09:15:11Z'
                - milestone: shipped
                  reached: false
                  reachedAt: '2026-10-04T07:30:02Z'
                - milestone: delivered
                  reached: false
                - milestone: completed
                  reached: false
                timeline:
                - fact: OrderPlaced
                  domain: order
                  occurredAt: '2026-10-03T09:12:00Z'
                  description: Order placed
                invoices: []
          headers:
            Location:
              description: URI of the new resource.
              schema:
                type: string
              example: /orders/4711
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /orders
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /orders
        '502':
          description: A Process or System API behind the gateway failed; try again later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-webshop/blob/main/docs/problems/downstream-failure.md
                title: Downstream Failure
                status: 502
                detail: A Process or System API behind the gateway failed; try again later.
                instance: /orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/placeOrderRequest'
            example:
              customerId: ACME
              orderLines:
              - productId: SKU-1042
                quantity: 12
              requestedDeliveryDate: '2026-10-09'
      x-business-keys:
        customerid: body.customerId
